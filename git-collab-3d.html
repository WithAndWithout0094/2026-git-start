<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git 협업 실습 — 3D 시퀀스</title>
<style>
  :root{
    --cA:#4da3ff; --cG:#b48cff; --cB:#3ddc97;
    --fail:#ff5d6c; --warn:#ffb347; --ink:#e8ecf4;
    --rx:16; --ry:-20; --zoom:1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    color:var(--ink); overflow:hidden;
    background:radial-gradient(1200px 700px at 50% 30%, #141b33 0%, #0b1020 55%, #05070d 100%);
  }
  /* ── 상단 UI ── */
  header{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:14px 18px; pointer-events:none;
  }
  h1{font-size:17px; font-weight:700; letter-spacing:.3px; text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .hint{
    font-size:12px; opacity:.75; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:5px 12px;
  }
  nav{display:flex; gap:8px; margin-left:auto; pointer-events:auto}
  nav button{
    font:inherit; font-size:13px; color:var(--ink); cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.15);
    border-radius:999px; padding:7px 16px; transition:.2s;
  }
  nav button:hover{background:rgba(255,255,255,.12)}
  nav button.on{
    background:linear-gradient(135deg, rgba(77,163,255,.25), rgba(61,220,151,.25));
    border-color:rgba(120,190,255,.6); box-shadow:0 0 14px rgba(90,170,255,.35);
  }
  /* ── 3D 무대 ── */
  #scene{
    position:absolute; inset:0; perspective:1300px; perspective-origin:50% 42%;
    cursor:grab; touch-action:none;
  }
  #scene.drag{cursor:grabbing}
  #world{
    position:absolute; left:50%; top:50%; width:0; height:0;
    transform-style:preserve-3d;
    transform:scale(var(--zoom)) rotateX(calc(var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg));
  }
  #world *{transform-style:preserve-3d}
  /* 바닥 그리드 */
  .floor{
    position:absolute; left:-800px; top:-800px; width:1600px; height:1600px;
    transform:translateY(330px) rotateX(90deg);
    background:
      repeating-linear-gradient(0deg, rgba(120,160,255,.13) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(90deg, rgba(120,160,255,.13) 0 1px, transparent 1px 80px);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 15%, transparent 68%);
    mask-image:radial-gradient(circle at 50% 50%, #000 15%, transparent 68%);
  }
  /* 참여자 기둥(유리판) */
  .pillar{position:absolute; left:0; top:0}
  .pane{
    position:absolute; left:-70px; top:-290px; width:140px; height:580px;
    border-radius:18px; border:1px solid; backdrop-filter:blur(2px);
  }
  .pillar .glow{
    position:absolute; left:-3px; top:-290px; width:6px; height:580px; border-radius:3px;
  }
  .phead{
    position:absolute; left:-90px; top:-350px; width:180px; text-align:center;
    font-weight:700; font-size:15px; text-shadow:0 2px 8px #000;
  }
  .phead .emoji{display:block; font-size:30px; margin-bottom:4px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  /* 메시지 화살표 막대 */
  .bar{position:absolute; left:0; top:0; height:6px; border-radius:3px; margin-top:-3px}
  .bar .dot{
    position:absolute; top:50%; width:11px; height:11px; margin-top:-5.5px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px 2px currentColor;
    animation:travel var(--dur,2.2s) linear infinite;
  }
  @keyframes travel{from{left:0}to{left:calc(100% - 11px)}}
  .bar.fail{
    background:repeating-linear-gradient(90deg, var(--fail) 0 10px, transparent 10px 18px)!important;
  }
  .bar.fail .dot{animation-direction:alternate; animation-duration:1.1s}
  /* 라벨 칩 (항상 정면을 봄) */
  .lbl{
    position:absolute; left:0; top:0; white-space:nowrap;
    font-size:12.5px; line-height:1; padding:6px 11px; border-radius:999px;
    background:rgba(10,14,26,.88); border:1px solid; box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  .lbl b{
    display:inline-block; min-width:17px; height:17px; line-height:17px; text-align:center;
    border-radius:50%; background:rgba(255,255,255,.14); font-size:10.5px; margin-right:6px;
  }
  .lbl.note{background:rgba(20,16,40,.92); font-size:12.5px; padding:7px 14px}
  .fade{animation:pop .5s backwards}
  @keyframes pop{from{opacity:0; transform:var(--tf) scale(.6)}to{opacity:1; transform:var(--tf) scale(1)}}
  /* 하단 범례 */
  footer{
    position:fixed; bottom:12px; left:0; right:0; z-index:10;
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    font-size:12px; opacity:.8; pointer-events:none;
  }
  footer span{display:flex; align-items:center; gap:5px}
  .sw{width:10px; height:10px; border-radius:3px; display:inline-block}
</style>
</head>
<body>
<header>
  <h1>🔀 Git 협업 실습 — 3D 시퀀스</h1>
  <span class="hint">🖱️ 드래그 = 회전 · 휠 = 확대/축소 · 더블클릭 = 원위치</span>
  <nav>
    <button id="tab1" class="on">① 충돌 없는 협업</button>
    <button id="tab2">② 충돌 발생과 해결</button>
  </nav>
</header>

<div id="scene"><div id="world"></div></div>

<footer>
  <span><i class="sw" style="background:var(--cA)"></i>작업자 A</span>
  <span><i class="sw" style="background:var(--cG)"></i>GitHub (origin)</span>
  <span><i class="sw" style="background:var(--cB)"></i>작업자 B</span>
  <span><i class="sw" style="background:var(--fail)"></i>push 거절</span>
  <span><i class="sw" style="background:var(--warn)"></i>충돌(CONFLICT)</span>
</footer>

<script>
(function(){
  const world = document.getElementById('world');
  const scene = document.getElementById('scene');
  const css = getComputedStyle(document.documentElement);
  const COLOR = {A:css.getPropertyValue('--cA').trim(), G:css.getPropertyValue('--cG').trim(),
                 B:css.getPropertyValue('--cB').trim(), fail:css.getPropertyValue('--fail').trim(),
                 warn:css.getPropertyValue('--warn').trim()};
  // 참여자 3D 좌표 (삼각형 배치: A 앞왼쪽, B 앞오른쪽, GitHub 뒤가운데)
  const P = {
    A:{x:-310, z:150, name:'작업자 A', emoji:'💻', c:'A'},
    G:{x:0,    z:-210, name:'GitHub (origin)', emoji:'☁️', c:'G'},
    B:{x:310,  z:150, name:'작업자 B', emoji:'💻', c:'B'},
  };
  // 시나리오 데이터  s:자기 자신 작업 / n:안내문 / from→to:메시지
  const FLOW1 = [
    {s:'A', t:'worker-a.md 작성 · add → commit'},
    {f:'A', to:'G', t:'push ✅'},
    {f:'B', to:'G', t:'fetch (확인만)'},
    {f:'G', to:'B', t:'A의 커밋 전달'},
    {s:'B', t:'merge → worker-a.md 반영'},
    {s:'B', t:'worker-b.md 작성 · add → commit'},
    {f:'B', to:'G', t:'push ✅'},
    {f:'A', to:'G', t:'fetch'},
    {f:'G', to:'A', t:'B의 커밋 전달'},
    {s:'A', t:'merge → worker-b.md 반영'},
    {n:1, t:'✅ A · GitHub · B 모두 같은 상태'},
  ];
  const FLOW2 = [
    {n:1, t:'둘 다 같은 문장을 서로 다르게 수정'},
    {s:'A', t:'수정 · add → commit'},
    {f:'A', to:'G', t:'push ✅ 먼저 도착'},
    {s:'B', t:'수정 · add → commit'},
    {f:'B', to:'G', t:'push ❌ 거절 (fetch first)', fail:1},
    {f:'B', to:'G', t:'fetch'},
    {f:'G', to:'B', t:'A의 커밋 받아옴'},
    {s:'B', t:'merge ⚡ CONFLICT 발생', warn:1},
    {s:'B', t:'최종 내용 결정 · add → commit', warn:1},
    {f:'B', to:'G', t:'push ✅ 성공'},
    {f:'A', to:'G', t:'pull (fetch + merge)'},
    {f:'G', to:'A', t:'최종본 동기화'},
    {n:1, t:'🎉 셋 다 같은 최신 커밋'},
  ];

  function el(cls, parent){const d=document.createElement('div'); d.className=cls; (parent||world).appendChild(d); return d;}
  function place(d, x, y, z, extra){
    const tf = `translate3d(${x}px,${y}px,${z}px) ${extra||''}`;
    d.style.setProperty('--tf', tf); d.style.transform = tf;
  }
  // 라벨은 카메라를 향하도록 역회전
  const BILL = `rotateY(calc(var(--ry)*-1deg)) rotateX(calc(var(--rx)*-1deg))`;

  function build(steps){
    world.innerHTML = '';
    el('floor');
    // 기둥 3개
    for(const k in P){
      const p = P[k], c = COLOR[p.c];
      const g = el('pillar'); place(g, p.x, 0, p.z);
      const pane = el('pane', g);
      pane.style.borderColor = c+'55';
      pane.style.background = `linear-gradient(180deg, ${c}26, ${c}0d 45%, ${c}1f)`;
      pane.style.boxShadow = `0 0 30px ${c}22, inset 0 0 24px ${c}14`;
      const glow = el('glow', g); glow.style.background = c; glow.style.boxShadow = `0 0 16px 2px ${c}`;
      const h = el('phead', g); h.innerHTML = `<span class="emoji">${p.emoji}</span>${p.name}`;
      h.style.color = c; h.style.transform = BILL;
    }
    // 단계들
    const y0 = -240, gap = Math.min(42, 480/steps.length);
    let num = 0;
    steps.forEach((st, i)=>{
      const y = y0 + gap*(i+1);
      const delay = (i*0.12)+'s';
      if(st.n){ // 가운데 안내문
        const l = el('lbl note fade'); l.textContent = st.t;
        l.style.borderColor = 'rgba(255,255,255,.3)';
        place(l, 0, y, 40, BILL + ' translate(-50%,-50%)');
        l.style.animationDelay = delay; return;
      }
      num++;
      if(st.s){ // 자기 작업 칩
        const p = P[st.s], c = st.warn?COLOR.warn:COLOR[p.c];
        const l = el('lbl fade'); l.innerHTML = `<b>${num}</b>↺ ${st.t}`;
        l.style.borderColor = c; l.style.color = '#fff';
        const inward = p.x < 0 ? 105 : -105;
        place(l, p.x+inward, y, p.z+10, BILL + ' translate(-50%,-50%)');
        l.style.animationDelay = delay; return;
      }
      // 메시지 화살표
      const a = P[st.f], b = P[st.to];
      const dx = b.x-a.x, dz = b.z-a.z;
      const len = Math.hypot(dx,dz), ang = -Math.atan2(dz,dx)*180/Math.PI;
      const c = st.fail ? COLOR.fail : COLOR[a.c];
      const bar = el('bar fade'+(st.fail?' fail':''));
      bar.style.width = len+'px';
      bar.style.background = `linear-gradient(90deg, ${c}, ${COLOR[b.c]})`;
      bar.style.boxShadow = `0 0 12px ${c}66`;
      bar.style.color = c;
      place(bar, a.x, y, a.z, `rotateY(${ang}deg)`);
      bar.style.transformOrigin = '0 50%';
      bar.style.animationDelay = delay;
      const dot = document.createElement('span'); dot.className='dot';
      dot.style.color = c; dot.style.animationDelay = delay; bar.appendChild(dot);
      // 라벨 (중간 지점, 정면 유지)
      const l = el('lbl fade'); l.innerHTML = `<b>${num}</b>${st.t}`;
      l.style.borderColor = st.fail?COLOR.fail:c; l.style.color='#fff';
      place(l, a.x+dx/2, y-26, a.z+dz/2, BILL + ' translate(-50%,-50%)');
      l.style.animationDelay = delay;
    });
  }

  // ── 회전/줌 조작 ──
  let rx=16, ry=-20, zoom=1, dragging=false, px=0, py=0, touched=false;
  function apply(){
    const r = document.documentElement.style;
    r.setProperty('--rx', rx); r.setProperty('--ry', ry); r.setProperty('--zoom', zoom);
  }
  scene.addEventListener('pointerdown', e=>{
    dragging=true; touched=true; px=e.clientX; py=e.clientY;
    scene.classList.add('drag'); scene.setPointerCapture(e.pointerId);
  });
  scene.addEventListener('pointermove', e=>{
    if(!dragging) return;
    ry += (e.clientX-px)*0.35;
    rx -= (e.clientY-py)*0.25;
    rx = Math.max(-8, Math.min(80, rx));
    px=e.clientX; py=e.clientY; apply();
  });
  addEventListener('pointerup', ()=>{dragging=false; scene.classList.remove('drag');});
  scene.addEventListener('wheel', e=>{
    e.preventDefault(); touched=true;
    zoom = Math.max(.45, Math.min(1.8, zoom * (e.deltaY<0?1.08:0.93))); apply();
  }, {passive:false});
  scene.addEventListener('dblclick', ()=>{rx=16; ry=-20; zoom=1; apply();});
  // 손대기 전까지 천천히 자동 회전
  (function idle(){ if(!touched){ ry+=0.06; apply(); } requestAnimationFrame(idle); })();

  // ── 탭 ──
  const t1=document.getElementById('tab1'), t2=document.getElementById('tab2');
  t1.onclick=()=>{t1.classList.add('on'); t2.classList.remove('on'); build(FLOW1);};
  t2.onclick=()=>{t2.classList.add('on'); t1.classList.remove('on'); build(FLOW2);};

  apply(); build(FLOW1);
})();
</script>
</body>
</html>
