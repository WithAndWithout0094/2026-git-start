<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git 대소동 — 작업자 A와 B의 충돌 사건</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    overflow:hidden; color:#2b2340;
    background:
      radial-gradient(circle at 8px 8px, rgba(43,35,64,.07) 2px, transparent 2.5px) 0 0/26px 26px,
      linear-gradient(180deg,#fdf6e3 0%,#ffe9c7 60%,#ffd9a8 100%);
  }
  /* ── 제목 ── */
  header{position:fixed;top:0;left:0;right:0;z-index:20;text-align:center;padding:12px;pointer-events:none}
  h1{
    display:inline-block;font-size:clamp(18px,4vw,30px);font-weight:900;letter-spacing:1px;
    color:#ff5d3a;text-shadow:2px 2px 0 #2b2340;
    background:#fff;border:3px solid #2b2340;border-radius:14px;padding:6px 22px;
    box-shadow:5px 5px 0 rgba(43,35,64,.9);transform:rotate(-1.5deg);
  }
  /* ── 무대 ── */
  #stage{position:absolute;inset:0;overflow:hidden}
  #stage.shake{animation:shake .5s}
  @keyframes shake{
    0%,100%{transform:none}20%{transform:translate(-12px,4px) rotate(-1deg)}
    40%{transform:translate(10px,-6px) rotate(1deg)}60%{transform:translate(-8px,2px)}80%{transform:translate(8px,-2px)}
  }
  .actor{position:absolute;text-align:center;transition:transform .4s}
  .actor .face{font-size:clamp(48px,9vw,84px);line-height:1;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
  .actor .tag{
    display:inline-block;margin-top:6px;font-weight:800;font-size:clamp(11px,2vw,15px);
    background:#2b2340;color:#fff;border-radius:999px;padding:3px 12px;
  }
  #cloud{top:9%;left:50%;transform:translateX(-50%)}
  #wa{bottom:16%;left:12%}
  #wb{bottom:16%;right:12%}
  #wa .tag{background:#1d6fd8}#wb .tag{background:#0f9d6a}
  .desk{font-size:clamp(30px,5.5vw,52px);display:block;margin-top:-6px}
  .jump{animation:jump .55s}
  @keyframes jump{0%,100%{transform:none}40%{transform:translateY(-26px)}}
  .tremble{animation:tremble .18s infinite}
  @keyframes tremble{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  /* ── 말풍선 ── */
  .bubble{
    position:absolute;max-width:min(46vw,300px);z-index:15;
    background:#fff;border:3px solid #2b2340;border-radius:16px;
    padding:9px 14px;font-size:clamp(12px,2.4vw,17px);font-weight:700;line-height:1.35;
    box-shadow:4px 4px 0 rgba(43,35,64,.85);opacity:0;transform:scale(.3);
    transition:opacity .25s,transform .25s;
  }
  .bubble.show{opacity:1;transform:scale(1)}
  .bubble::after{
    content:'';position:absolute;bottom:-14px;left:34px;border:8px solid transparent;
    border-top:12px solid #2b2340;
  }
  .bubble.flip::after{left:auto;right:34px}
  .bubble.up::after{bottom:auto;top:-20px;border-top-color:transparent;border-bottom:12px solid #2b2340}
  .bubble.scream{background:#fff23b;transform:scale(.3) rotate(-3deg)}
  .bubble.scream.show{transform:scale(1.08) rotate(-3deg)}
  /* ── 날아다니는 것들 ── */
  .pkg{position:absolute;z-index:12;font-size:clamp(26px,5vw,44px);transition:all 1.1s cubic-bezier(.45,-0.2,.55,1.2);filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
  .pkg .plabel{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:10px;font-weight:800;background:#2b2340;color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap;
  }
  /* ── 충돌 파일 ── */
  #paper{
    position:absolute;z-index:14;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  #paper.show{transform:translate(-50%,-50%) scale(1)}
  .half{
    display:inline-block;background:#fff;border:3px solid #2b2340;padding:12px 14px;
    font-weight:800;font-size:clamp(12px,2.4vw,17px);transition:transform .5s;position:relative;
  }
  .half.l{border-radius:12px 0 0 12px;border-right:2px dashed #ff5d3a;color:#1d6fd8}
  .half.r{border-radius:0 12px 12px 0;border-left:0;color:#0f9d6a}
  #paper.fight .half.l{animation:tugL .4s infinite}
  #paper.fight .half.r{animation:tugR .4s infinite}
  @keyframes tugL{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(-14px) rotate(-4deg)}}
  @keyframes tugR{0%,100%{transform:translateX(0) rotate(2deg)}50%{transform:translateX(14px) rotate(4deg)}}
  #paper.merged .half.l{border-right:2px solid transparent}
  #paper.merged .half{color:#7a3ce8;animation:none;transform:none}
  /* ── 효과 ── */
  #boom{
    position:absolute;z-index:18;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);
    font-size:clamp(60px,14vw,130px);font-weight:900;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  #boom.show{transform:translate(-50%,-50%) scale(1)}
  .confetti{position:absolute;z-index:16;top:-40px;font-size:22px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  /* ── 자막 ── */
  #caption{
    position:fixed;bottom:0;left:0;right:0;z-index:20;text-align:center;
    background:rgba(43,35,64,.94);color:#fff;
    font-size:clamp(13px,2.6vw,19px);font-weight:700;padding:14px 18px 16px;
    min-height:52px;transition:opacity .3s;
  }
  #caption b{color:#ffd166}
  /* ── 버튼 ── */
  #controls{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:8px}
  #controls button{
    font:inherit;font-weight:800;font-size:14px;cursor:pointer;
    background:#fff;border:3px solid #2b2340;border-radius:12px;padding:7px 14px;
    box-shadow:3px 3px 0 rgba(43,35,64,.85);transition:.15s;
  }
  #controls button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(43,35,64,.85)}
  #endcard{
    position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:rgba(43,35,64,.55);backdrop-filter:blur(3px);
  }
  #endcard .card{
    background:#fff;border:4px solid #2b2340;border-radius:20px;padding:28px 34px;text-align:center;
    box-shadow:8px 8px 0 rgba(43,35,64,.9);transform:rotate(-1deg);max-width:86vw;
  }
  #endcard h2{font-size:clamp(20px,4.5vw,30px);color:#ff5d3a;margin-bottom:10px}
  #endcard p{font-weight:700;font-size:clamp(13px,2.6vw,17px);line-height:1.6}
  #endcard button{
    margin-top:6px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;color:#fff;
    background:#ff5d3a;border:3px solid #2b2340;border-radius:14px;padding:10px 26px;
    box-shadow:4px 4px 0 rgba(43,35,64,.9);
  }
</style>
</head>
<body>
<header><h1>💥 Git 대소동 — A와 B의 충돌 사건</h1></header>

<div id="stage">
  <div class="actor" id="cloud"><span class="face" id="cloudFace">☁️</span><span class="tag">GitHub (origin)</span></div>
  <div class="actor" id="wa"><span class="face" id="waFace">🧑‍💻</span><span class="desk">🖥️</span><span class="tag">작업자 A</span></div>
  <div class="actor" id="wb"><span class="face" id="wbFace">👩‍💻</span><span class="desk">🖥️</span><span class="tag">작업자 B</span></div>

  <div class="bubble" id="bubA"></div>
  <div class="bubble flip" id="bubB"></div>
  <div class="bubble up" id="bubG"></div>

  <div id="paper">
    <span class="half l" id="halfL">&lt;&lt;&lt; A의 문장</span><span class="half r" id="halfR">B의 문장 &gt;&gt;&gt;</span>
  </div>
  <div id="boom">💥충돌!!</div>
</div>

<div id="caption">잠시 후, 사건이 시작됩니다...</div>

<div id="controls"><button id="btnReplay">⟳ 처음부터</button></div>

<div id="endcard">
  <div class="card">
    <h2>— 끝 —</h2>
    <p>오늘의 교훈 📖<br>“<b>올리기(push) 전에 먼저 받아오세요(pull)</b>”<br>
    그리고 충돌은 사고가 아니라, <b>사람이 결정할 차례</b>라는 신호!</p>
    <button id="btnAgain">🎬 다시 보기</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage'), cap=$('caption');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let run=0; // 재생 세대 (다시보기 시 이전 타임라인 중단용)

  function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
  function bubble(el,anchor,text,scream){
    const p=center(anchor);
    el.classList.toggle('scream',!!scream);
    el.innerHTML=text;
    el.style.left=Math.max(8,Math.min(innerWidth-el.offsetWidth-8,p.x-60))+'px';
    // 위치 먼저 잡고 표시
    el.style.top='-999px'; el.classList.add('show');
    requestAnimationFrame(()=>{
      const h=el.offsetHeight;
      const isCloud=el.id==='bubG';
      el.style.top=(isCloud? p.y+50 : p.y-h-96)+'px';
    });
  }
  function hideBubbles(){['bubA','bubB','bubG'].forEach(i=>$(i).classList.remove('show'))}
  async function fly(fromEl,toEl,emoji,label,dur=1100){
    const a=center(fromEl),b=center(toEl);
    const p=document.createElement('div');p.className='pkg';
    p.innerHTML=emoji+(label?`<span class="plabel">${label}</span>`:'');
    p.style.left=a.x-20+'px';p.style.top=a.y-20+'px';p.style.transitionDuration=dur+'ms';
    stage.appendChild(p);
    await sleep(30);
    p.style.left=b.x-20+'px';p.style.top=b.y-20+'px';
    await sleep(dur);
    p.remove();
  }
  async function bounce(fromEl,toEl,emoji,label){
    const a=center(fromEl),b=center(toEl);
    const p=document.createElement('div');p.className='pkg';
    p.innerHTML=emoji+(label?`<span class="plabel">${label}</span>`:'');
    p.style.left=a.x-20+'px';p.style.top=a.y-20+'px';p.style.transitionDuration='900ms';
    stage.appendChild(p);
    await sleep(30);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    p.style.left=mx+'px';p.style.top=my+'px';
    await sleep(900);
    p.style.transitionDuration='700ms';
    p.style.left=a.x-20+'px';p.style.top=a.y+10+'px';
    p.style.transform='rotate(360deg)';p.style.opacity='.3';
    await sleep(700);p.remove();
  }
  function face(id,e){$(id).textContent=e}
  function confetti(n=36){
    for(let i=0;i<n;i++){
      const c=document.createElement('span');c.className='confetti';
      c.textContent=['🎉','🎊','✨','⭐','💚','💙'][i%6];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(1.6+Math.random()*1.8)+'s';
      c.style.animationDelay=(Math.random()*.8)+'s';
      stage.appendChild(c);setTimeout(()=>c.remove(),4200);
    }
  }
  async function caption(t){cap.style.opacity=0;await sleep(200);cap.innerHTML=t;cap.style.opacity=1}

  async function play(){
    const my=++run;
    const alive=()=>my===run;
    // 초기화
    hideBubbles();$('endcard').style.display='none';
    $('paper').classList.remove('show','fight','merged');$('boom').classList.remove('show');
    face('waFace','🧑‍💻');face('wbFace','👩‍💻');face('cloudFace','☁️');
    $('halfL').innerHTML='&lt;&lt;&lt; A의 문장';$('halfR').innerHTML='B의 문장 &gt;&gt;&gt;';
    $('wa').classList.remove('tremble');$('wb').classList.remove('tremble');

    // 1장. 평화
    await caption('<b>제1장</b> — 평화로운 오후. 두 사람이 같은 파일의 <b>같은 문장</b>을 고치고 있다...');
    if(!alive())return;
    bubble($('bubA'),$('wa'),'이 문장, 내가 더 멋지게 고쳐야지~ ✍️');
    await sleep(1700);if(!alive())return;
    bubble($('bubB'),$('wb'),'후후, 이 문장은 내 스타일로 바꿔야겠어 ✍️');
    await sleep(2000);if(!alive())return;hideBubbles();

    // 2장. A 먼저 push
    await caption('<b>제2장</b> — A가 먼저 <b>push</b>! 부지런한 자가 승리한다');
    if(!alive())return;
    $('wa').classList.add('jump');setTimeout(()=>$('wa').classList.remove('jump'),600);
    bubble($('bubA'),$('wa'),'먼저 올린다~ 🚀 git push!');
    await fly($('wa'),$('cloud'),'📦','commit');if(!alive())return;
    face('cloudFace','⛅');
    bubble($('bubG'),$('cloud'),'냠! 잘 받았습니다 ✅');
    await sleep(1800);if(!alive())return;hideBubbles();

    // 3장. B push 거절
    await caption('<b>제3장</b> — 아무것도 모르는 B도 <b>push</b>... 그러나!');
    if(!alive())return;
    bubble($('bubB'),$('wb'),'나도 완성! git push~ 🚀');
    await bounce($('wb'),$('cloud'),'📦','commit');if(!alive())return;
    face('cloudFace','🌩️');
    bubble($('bubG'),$('cloud'),'❌ 거절! 너, A가 올린 최신 버전 모르잖아! <b>(fetch first)</b>',true);
    face('wbFace','😱');
    $('wb').classList.add('jump');setTimeout(()=>$('wb').classList.remove('jump'),600);
    await sleep(2600);if(!alive())return;hideBubbles();

    // 4장. pull → 충돌
    await caption('<b>제4장</b> — B: “일단 받아와 보자” <b>git pull</b>... 그 순간!');
    if(!alive())return;
    bubble($('bubB'),$('wb'),'알았어 알았어~ git pull 📥');
    await fly($('cloud'),$('wb'),'📦','A의 커밋');if(!alive())return;
    hideBubbles();
    $('paper').classList.add('show');
    await sleep(500);if(!alive())return;
    $('boom').classList.add('show');stage.classList.add('shake');
    $('paper').classList.add('fight');
    face('wbFace','😵');face('waFace','😮');
    await sleep(600);stage.classList.remove('shake');if(!alive())return;
    await caption('<b>충돌(CONFLICT)!</b> — 같은 문장이 두 버전으로 갈라져 싸우기 시작했다');
    bubble($('bubG'),$('cloud'),'같은 줄을 서로 다르게 고쳤네요. <b>어느 쪽을 남길지는 사람이 정하세요!</b>');
    await sleep(3000);if(!alive())return;
    hideBubbles();$('boom').classList.remove('show');

    // 5장. 해결
    await caption('<b>제5장</b> — B의 결단. 충돌 표시를 지우고 두 문장을 하나로 합친다');
    if(!alive())return;
    face('wbFace','🥵');$('wb').classList.add('tremble');
    bubble($('bubB'),$('wb'),'제가... 합치겠습니다 💦 타닥타닥 ⌨️');
    await sleep(2300);if(!alive())return;
    $('wb').classList.remove('tremble');
    $('paper').classList.remove('fight');$('paper').classList.add('merged');
    $('halfL').innerHTML='A와 B의 문장을';$('halfR').innerHTML='하나로 합침 ❤️';
    face('wbFace','😤');
    hideBubbles();
    bubble($('bubB'),$('wb'),'add → commit! <b>합의문(Merge Commit)</b> 완성 📝');
    await sleep(2400);if(!alive())return;hideBubbles();

    // 6장. 해피엔딩
    await caption('<b>제6장</b> — 다시 push! 이번엔 통과. A도 pull로 합의문을 받는다');
    if(!alive())return;
    await fly($('wb'),$('cloud'),'📦','merge commit');if(!alive())return;
    face('cloudFace','🌤️');
    bubble($('bubG'),$('cloud'),'완벽합니다 ✅ 평화 협정 접수!');
    await sleep(1600);if(!alive())return;
    bubble($('bubA'),$('wa'),'나도 git pull! 📥');
    await fly($('cloud'),$('wa'),'📦','최종본');if(!alive())return;
    $('paper').classList.remove('show');
    face('waFace','🥳');face('wbFace','🥳');face('cloudFace','😎');
    hideBubbles();confetti();
    await caption('🎉 <b>해피엔딩</b> — 세 저장소 모두 같은 최신 커밋! 충돌은 오류가 아니라 협업의 일부');
    await sleep(3200);if(!alive())return;
    $('endcard').style.display='flex';
  }

  $('btnReplay').onclick=play;
  $('btnAgain').onclick=play;
  play();
})();
</script>
</body>
</html>
